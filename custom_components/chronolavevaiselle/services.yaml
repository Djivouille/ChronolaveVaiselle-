start_cycle:
  name: Start cycle
  description: Starts the dishwasher countdown.
  fields:
    duration:
      name: Duration
      description: Cycle duration in minutes. Uses the configured default when omitted.
      required: false
      example: 120
      selector:
        number:
          min: 1
          max: 600
          unit_of_measurement: min
          mode: box

empty:
  name: Dishwasher emptied
  description: Records that a person emptied the dishwasher.
  fields:
    person:
      name: Person
      description: Family member who emptied the dishwasher. Must be one of the configured persons.
      required: true
      example: Chloe
      selector:
        text: {}
